server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy to the backend so the browser calls same-origin /api/*
    # (avoids CORS). host.docker.internal resolves to the host machine,
    # where the backend runs on port 3000 (see docker-compose.yml extra_hosts).
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: routes like /callback don't exist as files,
    # they're handled client-side after the esignet redirect.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
